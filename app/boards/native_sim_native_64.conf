# STICKER simulator (native_sim/native/64), on top of prj.conf. Debug-like:
# shell and log on the console, every subsystem on (no flash/RAM budget on the
# host). See doc/simulator.md.

# Host build: no LTO, no SoC power management, no hardware watchdog.
CONFIG_LTO=n
CONFIG_ISR_TABLES_LOCAL_DECLARATION=n
CONFIG_PM=n
CONFIG_WATCHDOG=n
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_HWINFO=n
CONFIG_RTC_STM32=n
CONFIG_I2C_STM32_BUS_RECOVERY=n

# Emulated buses and the STICKER emulators (drivers/sim).
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_SPI_EMUL=y
CONFIG_GPIO_EMUL=y
CONFIG_RTC_EMUL=y
CONFIG_STICKER_SIM=y

# Settings + history on the simulated flash (persist with --flash=<file>).
CONFIG_FLASH_SIMULATOR=y

# The board's kernel tick (STM32WL LPTIM build): radio windows are timed in
# ticks, and the native_sim default of 100 Hz opens them up to 10 ms late.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# sys_reboot() re-executes the simulator with the same arguments.
CONFIG_REBOOT=y
CONFIG_NATIVE_SIM_REBOOT=y

# Console, log and shell on the native UART (stdin/stdout with -uart_stdinout).
CONFIG_PRINTK=y
CONFIG_FW_DEBUG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_THREAD_NAME=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="sticker:~$ "
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=y
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_ARGC_MAX=40
CONFIG_I2C_SHELL=n
CONFIG_LORA_SHELL=n
CONFIG_APP_CMD_DEBUG_SHELL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Generous stacks and heap: the host has room, and a simulator must not add
# stack overflows of its own.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Same libc as the target (picolibc), so the app's transitive includes match
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
