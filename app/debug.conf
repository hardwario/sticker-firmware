# Float printf support is not needed: all %f log/shell output was converted to
# integer formatting (APP_FP* in app_log.h), freeing debug flash.
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_FW_DEBUG=y

CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y

CONFIG_THREAD_NAME=y

CONFIG_USE_SEGGER_RTT=y

CONFIG_LOG=y

# Logging mode: MINIMAL routes LOG_* straight to printk (-> RTT console via
# CONFIG_RTT_CONSOLE), with no deferred log thread, no internal buffer and no
# backend layer. Saves ~14 KB flash + ~11 KB RAM vs deferred mode. Trade-off:
# no timestamps/prefixes in the log line, and build-time level filtering only
# (CONFIG_LOG_MAX_LEVEL still applies, but the `log` shell cmd can't change
# levels at runtime).
# CONFIG_LOG_MODE_MINIMAL=y

# --- Deferred-logging config (full RTT backend, timestamps, runtime levels) ---
# ENABLED (was MINIMAL): MINIMAL routes LOG_* synchronously via printk, which
# blocks the calling context long enough to make the STICKER miss the tight
# high-DR (SF7) Class-A RX1 window -> downlinks (e.g. fPort 85 req_history) are
# not received. Deferred mode drains logs on a separate thread with a DROP-mode
# backend, so logging never stalls the RX timing. (~14 KB flash / ~11 KB RAM.)
# Buffers trimmed vs the reference block to fit the near-full debug RAM budget
# (deferred adds ~11 KB; default 2048 sizes overflowed RAM by ~1.7 KB).
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=1024
CONFIG_LOG_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=128
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=0
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_PROMPT_RTT=""
CONFIG_SHELL_RTT_RX_POLL_PERIOD=200
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_VT100_COMMANDS=n

# I2C/LoRa-PHY shells dropped to keep the debug image inside the
# CONFIG_FLASH_LOAD_SIZE budget (see prj.conf); re-enable locally if needed.
CONFIG_I2C_SHELL=n

# Down (host->target, shell RX) doesn't need to match the up/log buffer: the
# Zephyr default is 16 B, but the shell needs enough for a full command line
# (e.g. `ats cmd <hex>` payloads) — 256 B is a comfortable compromise, freeing
# ~768 B of RAM that was otherwise just mirroring the up-buffer size for no
# documented reason.
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024

CONFIG_SEGGER_RTT_SECTION_CUSTOM=y

CONFIG_PM=n

# Deep-sleep / auto-suspend (#113): sys_poweroff() puts the STM32WL into Shutdown
# after CONFIG_APP_DEBUG_AUTOSUSPEND_S of RTT/shell inactivity, so a forgotten
# debug unit (PM=n, CPU never sleeps) stops draining its battery. Wake = NRST.
CONFIG_POWEROFF=y

CONFIG_LORA_LOG_LEVEL_DBG=n
CONFIG_SENSOR_LOG_LEVEL_DBG=n
CONFIG_W1_LOG_LEVEL_DBG=n

# Debug-only region trim (release keeps AU915/US915): the bench only ever
# exercises EU868 (TTN + ChirpStack), and the near-full debug image needs the
# flash/RAM headroom. Measured ~5.9 KB flash / ~0.7 KB RAM (2026-06-17 analysis).
CONFIG_LORAMAC_REGION_AU915=n
CONFIG_LORAMAC_REGION_US915=n

CONFIG_LORA_SHELL=n

# Debug drops the P2P transport (release keeps it, default y): the near-full
# debug image only has ~4.75 KB headroom vs release's ~58.5 KB (doc/p2p.md
# §11, measured 2026-08-17) — not enough for the dual-stack addition.
CONFIG_RADIO_P2P=n

# The 3 new p2p_* config fields (#118) grow g_app_config (BSS) by 12 B even
# with CONFIG_RADIO_P2P=n above -- config schema size is independent of
# whether the transport code itself is compiled in. The already-99.92%-full
# debug image (0 B free before this) squeezes that straight out of the
# __noinit history RAM ring (CONFIG_APP_HISTORY_FLASH=n below); trimming by
# just the 12 B needed leaves ~0 B free again, so shave 32 B (1024 -> 992) for
# a small working margin instead.
CONFIG_APP_HISTORY_BYTES=992

# Enable stack usage diagnostics for the m_work_q probe in app_lrw.c
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_APP_CMD_DEBUG_SHELL=y

# The debug image does not fit under the history_partition offset, so keep
# history in RAM and relax the image budget up to the storage_partition offset
# (sticker.dts) — NVS settings + LoRaWAN NVM still rewrite storage at runtime,
# so the linker must keep the image out of it (see prj.conf for the rationale).
CONFIG_APP_HISTORY_FLASH=n
CONFIG_FLASH_LOAD_SIZE=0x3C000


# The v1.4.0 debug image is near-full; the 1-Wire slot/teach feature does
# not fit at INF. Cap RTT logging to WRN to make room (shell + LED still
# work for testing; raise to 4 locally for full INF/DBG diagnostics).
CONFIG_LOG_MAX_LEVEL=2

# =============================================================================
# Optional subsystems — the highest-value ones OFF by default here to give
# debug.conf real headroom (issue #394: this build used to sit at 98.48%
# flash / 99.92% RAM with everything on — only ~20-170 B "free" per the
# linker's own report, and that margin turned out to be unsafe in practice,
# not just tight: a system-heap write past the end of RAM crashed real HW at
# exactly that margin). Every line below (on or off) is a real, measured,
# independently-working Kconfig toggle — verified to build and link cleanly
# alone and in every combination tried.
#
# To re-enable one of the OFF-by-default toggles for a session: delete/
# comment its `=n` line below, or override on the command line without
# editing this file, e.g.:
#   west build -b sticker app -- -DEXTRA_CONF_FILE=debug.conf -DCONFIG_W1=y
#
# Measured savings (this build, 2026-08-19; baseline = mainline debug.conf
# with every toggle below at its Kconfig default, i.e. all ON: FLASH 242028 B
# / 98.48%, RAM 65484 B / 99.92%). Ranked by flash impact:
#
# | Toggle                              | Flash saved |    RAM saved | What it drops | Default here |
# |-------------------------------------|------------:|-------------:|---------------|:------------:|
# | CONFIG_RADIO_LORAWAN=n              |    ~41.0 KB |     ~15.1 KB | LoRaMac stack + radio HAL + app_lrw.c — **disables ALL radio transmission** (telemetry/alarm still sampled + history-captured locally, just never sent). Biggest lever by far, but a much bigger behavioral change than the others below — opt in explicitly, not part of the default set. App-level name wrapping the underlying CONFIG_LORAWAN (`select`), pairs with CONFIG_RADIO_P2P below. | **ON** (opt out with `-DCONFIG_RADIO_LORAWAN=n`) |
# | CONFIG_W1=n                         |    ~20.3 KB |      ~0.5 KB | 1-Wire bus: DS18B20, DS28E17 machine-probe bridge, ROM-bound slot registry (app_w1*.c, app_ds18b20.c, app_machine_probe.c) | OFF |
# | CONFIG_LIS2DH=n                     |     ~7.6 KB |      ~0.3 KB | Accelerometer (orientation, motion, free-fall) | OFF |
# | CONFIG_APP_BUZZER=n                 |     ~2.3 KB |      ~0.8 KB | Buzzer/melody HW variant (#338) + its shell/remote-command surface | OFF |
# | CONFIG_APP_PYQ1648=n                |     ~1.0 KB |      ~2.3 KB | PIR motion sensor (biggest single RAM win among the sensor toggles) | OFF |
# | CONFIG_SHT4X=n                      |     ~2.1 KB |      ~0.1 KB | Onboard temperature/humidity sensor | on (small win, not worth remembering to re-enable) |
# | CONFIG_APP_CALIBRATION=n            |     ~2.0 KB |      ~0.3 KB | Magnet-triggered factory calibration mode | on (ditto) |
# | CONFIG_OPT3001=n                    |    ~0.75 KB |         ~0 B | Ambient light sensor | on (negligible) |
# |-------------------------------------|------------:|-------------:|---------------|:------------:|
# | **4 OFF-by-default together**       |  **~31 KB** |  **~3.9 KB** | New default baseline: FLASH 85.46%, RAM 93.74% |
# | **+ CONFIG_RADIO_LORAWAN=n on top** |  **~72 KB** | **~19.0 KB** | Radio-free bench baseline: FLASH 68.36%, RAM 70.15% |
#
# CONFIG_RADIO_P2P (app/Kconfig) pairs with CONFIG_RADIO_LORAWAN above and
# is now wired to the real raw-LoRa P2P transport (#118) — it was an inert
# placeholder when this table was written. It is OFF in this file (see the
# headroom note further up); the two-STICKER bench overlay
# debug_p2p_bench.conf turns it back on and turns CONFIG_RADIO_LORAWAN off,
# which is the only build where P2P is exercised on a debug image.
#
# Not included above (known limitations / deliberately out of scope, see
# issue #395 for the full writeup):
# - CONFIG_DS28E17=n *alone* (keep plain W1/DS18B20, drop only the
#   machine-probe bridge) does NOT currently link — app_w1_slots.c's own
#   sensor-type registry references app_machine_probe_* unconditionally.
#   Use CONFIG_W1=n (drops both together) instead.
# - NFC, the alarm engine, hall/input counters, and history are NOT
#   independently toggleable today — each referenced from many more files
#   (app_compose.c, app_alarm.c, app_cmd.c, app_settings.c, ...) than a
#   single Kconfig flag away. Making any of them optional needs a dedicated
#   pass through those cross-references (see issue #395).
# - CONFIG_ADC=n (battery voltage) was not attempted — referenced from 6
#   files (calibration/alarm/sensor/cmd/lrw/main), and the voltage itself is
#   near-universally wanted in every telemetry frame, so unlikely to be worth
#   the effort for the (probably small) ADC driver footprint it would save.
CONFIG_W1=n
CONFIG_LIS2DH=n
CONFIG_APP_BUZZER=n
CONFIG_APP_PYQ1648=n
