# Event log bench image: layer on debug.conf + debug-history-flash.conf
# (with debug-history-flash.overlay). Real flash ring for history + event log,
# RTT shell + logs, accelerometer on; drops what the motion test does not need
# to fit the 224 KB code partition. EU868 only (debug.conf), no 1-Wire.
CONFIG_LIS2DH=y
CONFIG_SHT4X=n
CONFIG_OPT3001=n
CONFIG_APP_CALIBRATION=n
CONFIG_APP_BUZZER=n
CONFIG_APP_PYQ1648=n
CONFIG_W1=n
CONFIG_LOG=n
CONFIG_SHELL_HELP=n
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=n
