#
# Pair with debug-history-flash.overlay (16 KB history_partition @ 0x38000,
# code_partition grown to 224 KB). Overrides debug.conf's history-in-RAM
# fallback so a debug build (full RTT shell) can exercise the real flash-ring
# backend: persistence across reboot, page wrap/eviction (8 x 2 KB pages wrap
# in minutes, not hours), torn-tail recovery, and the clock-sync base-time
# backfill (app_history_on_clock_sync) — none of which are testable on a
# stock debug build (CONFIG_APP_HISTORY_FLASH=n) or a stock release build (no
# shell to drive `history *` / `w1` / `alarm` interactively).
#
# Usage: west build -b sticker . -p always -- \
#   -DEXTRA_CONF_FILE="debug.conf;debug-history-flash.conf" \
#   -DEXTRA_DTC_OVERLAY_FILE=debug-history-flash.overlay

CONFIG_APP_HISTORY_FLASH=y

# Must match debug-history-flash.overlay's code_partition size (224 KB) — the
# linker fails the build ("region ROM overflowed") instead of letting the
# image grow into the runtime-written history_partition (see prj.conf).
CONFIG_FLASH_LOAD_SIZE=0x38000
