# TOWER-over-LoRa P0 bench (throw-away; doc/plan "TOWER protocol as the P2P
# transport" §13.1). Layer on debug.conf + debug_p2p_bench.conf:
#   -DEXTRA_CONF_FILE="debug.conf;debug_p2p_bench.conf;debug_tower_bench.conf"
CONFIG_APP_P2P_TOWER_BENCH=y

# A TWR line is up to ~170 chars; the RTT backend's drop mode cuts each message
# at this size (128 lost the tail fields at SF7 already).
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=192
