# Provisioning overlay -- layer this ON TOP of debug.conf:
#
#   west build -b sticker app -- \
#     -DEXTRA_CONF_FILE="debug.conf;provisioning.conf"
#
# Purpose: the production-line image. It brings up every sensor and LoRaWAN
# (EU868) so a unit can be checked end to end, and it gives the RTT shell for
# writing the identity, keys and configuration into NVS. The release image is
# flashed afterwards (without an erase) and boots with those NVS values.
# Debug and release must be built from the same commit so the settings
# layout matches.
#
# What is out of scope here: history (a few records in RAM only), P2P
# (debug.conf drops it), the other LoRaWAN regions (debug.conf trims them)
# and the log output.

# All sensors on (debug.conf turns these off to make room for logging).
CONFIG_W1=y
CONFIG_LIS2DH=y
CONFIG_APP_BUZZER=y
CONFIG_APP_PYQ1648=y

# No logging. With every sensor on, debug.conf overflows the 240 KB image
# budget by ~28 KB; the log subsystem (deferred thread, RTT log backend,
# every LOG_* call site) is the only lever large enough. Measured on
# 8ab438a9: 231.7 KB / 94.3 % flash, 84.2 % RAM. The shell, printk and the
# RTT console stay, so every `ats` / `config` command still works; state is
# read back through the shell rather than from the log.
CONFIG_LOG=n

# History is not used on the line; keep the RAM ring minimal.
CONFIG_APP_HISTORY_BYTES=32
