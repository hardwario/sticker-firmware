syntax = "proto3";

message NfcConfigMessage {
    optional bool factory = 1;

    optional string secret_key = 2;
    optional uint32 serial_number = 3;
    optional uint32 nonce_counter = 4;

    optional Lorawan lorawan = 5;
    optional Application application = 6;

    message Lorawan {
        enum Region {
            EU868 = 0;
            US915 = 1;
            AU915 = 2;
        }

        enum Activation {
            OTAA = 0;
            ABP = 1;
        }

        enum Network {
            PUBLIC = 0;
            PRIVATE = 1;
        }

        optional Region region = 1;
        optional Network network = 2;
        optional bool adr = 3;
        optional Activation activation = 4;
        optional string deveui = 5;
        optional string joineui = 6;
        optional string nwkkey = 7;
        optional string appkey = 8;
        optional string devaddr = 9;
        optional string nwkskey = 10;
        optional string appskey = 11;
        optional uint32 sub_band = 12;
    }

    message Application {
        optional bool calibration = 1;
        optional uint32 interval_sample = 2;
        optional uint32 interval_aggreg = 3;
        optional uint32 interval_report = 4;
        optional bool alarm_temperature_enabled = 5;
        optional float alarm_temperature_lo = 6;
        optional float alarm_temperature_hi = 7;
        optional float alarm_temperature_hst = 8;
        optional bool alarm_humidity_enabled = 9;
        optional float alarm_humidity_lo = 10;
        optional float alarm_humidity_hi = 11;
        optional float alarm_humidity_hst = 12;
        optional bool alarm_pressure_enabled = 13;
        optional float alarm_pressure_lo = 14;
        optional float alarm_pressure_hi = 15;
        optional float alarm_pressure_hst = 16;
        optional bool alarm_t1_temperature_enabled = 17;
        optional float alarm_t1_temperature_lo = 18;
        optional float alarm_t1_temperature_hi = 19;
        optional float alarm_t1_temperature_hst = 20;
        optional bool alarm_t2_temperature_enabled = 21;
        optional float alarm_t2_temperature_lo = 22;
        optional float alarm_t2_temperature_hi = 23;
        optional float alarm_t2_temperature_hst = 24;
        optional bool hall_left_counter = 25;
        optional bool hall_left_notify_act = 26;
        optional bool hall_left_notify_deact = 27;
        optional bool hall_right_counter = 28;
        optional bool hall_right_notify_act = 29;
        optional bool hall_right_notify_deact = 30;
        optional bool input_a_counter = 31;
        optional bool input_a_notify_act = 32;
        optional bool input_a_notify_deact = 33;
        optional bool input_b_counter = 34;
        optional bool input_b_notify_act = 35;
        optional bool input_b_notify_deact = 36;
        optional float corr_temperature = 37;
        optional float corr_t1_temperature = 38;
        optional float corr_t2_temperature = 39;
        optional bool cap_hall_left = 40;
        optional bool cap_hall_right = 41;
        optional bool cap_input_a = 42;
        optional bool cap_input_b = 43;
        optional bool cap_light_sensor = 44;
        optional bool cap_barometer = 45;
        optional bool cap_pir_detector = 46;
        optional bool cap_1w_thermometer = 47;
        optional bool cap_1w_machine_probe = 48;
    }
}

message DownlinkCommand {
    uint32 seq = 1;

    oneof body {
        SetParam        set_param        = 2;
        GetParam        get_param        = 3;
        GetInfo         get_info         = 4;
        GetConfig       get_config       = 5;
        SettingsSave    settings_save    = 6;
        Reboot          reboot           = 7;
        FactoryReset    factory_reset    = 8;
        ForceSend       force_send       = 9;
        ResetCounters   reset_counters   = 10;
        ReqHistory      req_history      = 11;
    }

    message SetParam {
        optional NfcConfigMessage.Lorawan     lorawan     = 1;
        optional NfcConfigMessage.Application application = 2;
    }

    message GetParam {
        repeated uint32 lorawan_field     = 1;
        repeated uint32 application_field = 2;
    }

    message GetInfo      { }
    message GetConfig    { optional uint32 page = 1; }
    message SettingsSave { }
    message Reboot       { }
    message FactoryReset { }
    message ForceSend    { }
    message ResetCounters {
        optional bool hall_left  = 1;
        optional bool hall_right = 2;
        optional bool input_a    = 3;
        optional bool input_b    = 4;
    }
    message ReqHistory   { optional uint32 from_unix = 1; optional uint32 to_unix = 2; }
}

message DownlinkResponse {
    uint32 seq = 1;

    oneof body {
        Ack          ack           = 2;
        Info         info          = 3;
        ConfigDump   config_dump   = 4;
        HistoryFrame history_frame = 5;
        Error        error         = 6;
    }

    message Ack { }

    message Info {
        string build_version = 1;
        bytes  dev_eui       = 2;
        uint32 serial_number = 3;
        string board         = 4;
        uint32 lrw_state     = 5;
    }

    message ConfigDump {
        uint32 page_index = 1;
        uint32 page_count = 2;
        optional NfcConfigMessage.Lorawan     lorawan     = 3;
        optional NfcConfigMessage.Application application = 4;
    }

    message HistoryFrame {
        uint32 frame_index = 1;
        uint32 frame_count = 2;
        uint32 t0_unix     = 3;
        bytes  samples     = 4;
    }

    message Error {
        enum Code {
            UNKNOWN             = 0;
            BAD_REQUEST         = 1;
            OUT_OF_RANGE        = 2;
            NOT_READY           = 3;
            HISTORY_UNAVAILABLE = 4;
            UNSUPPORTED_FIELD   = 5;
            PERSIST_FAILED      = 6;
        }

        Code   code         = 1;
        uint32 fault_field  = 2;
        string detail       = 3;
    }
}
