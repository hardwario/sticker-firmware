version: 1

module:
  name: app_config
  settings_prefix: config
  shell_command: config
  log_module: app_config
  version: 3

enums:
  lrw_region:
    - name: EU868
      value: 0
      shell: eu868
    - name: US915
      value: 1
      shell: us915
    - name: AU915
      value: 2
      shell: au915

  lrw_network:
    - name: PUBLIC
      value: 0
      shell: public
    - name: PRIVATE
      value: 1
      shell: private

  lrw_activation:
    - name: OTAA
      value: 0
      shell: otaa
    - name: ABP
      value: 1
      shell: abp

  motion_sensitivity:
    - name: "OFF"
      value: 0
      shell: "off"
    - name: LOW
      value: 1
      shell: low
    - name: MEDIUM
      value: 2
      shell: medium
    - name: HIGH
      value: 3
      shell: high

proto:
  message: AppConfigMessage
  extra_fields:
    - {name: factory, type: bool, proto_id: 1, proto_group: root}
  groups:
    - key: root
    - key: lorawan
      message: Lorawan
      field: lorawan
      proto_id: 5
      strip_prefix: lrw_
    - key: application
      message: Application
      field: application
      proto_id: 6
    - key: sensors
      message: Sensors
      field: sensors
      proto_id: 7
    - key: alarms
      message: Alarms
      field: alarms
      proto_id: 8

# Command protocol (LoRaWAN fPort 85 downlink + NFC). The single source of truth
# for which commands exist, their wire id, dispatch routing and availability.
# configen generates from `list`: the proto `Command` oneof, the decoder
# _CMD_NAMES/_CMD_TAGS maps, and the app_cmd_dispatch() switch. The per-command
# body sub-messages and handler bodies stay hand-written (see configen-commands
# design). Per-entry fields:
#   name/proto_id : wire identity (append-only; reserved on removal).
#   body          : protobuf sub-message type (hand-written in the proto).
#   kind          : handler (calls app_cmd_handle_<name>) | action (sets *action).
#   action        : APP_CMD_ACTION_* to set (action kind, or a handler that defers).
#   transports    : optional allow-list (lrw/nfc/shell); omitted = all.
#   response      : success body — ack | info | config_dump | none | info_deferred |
#                   w1_scan (drives the decoder/docs; the FW emits it in the handler).
commands:
  message: Command
  response: Response
  reserved: []
  list:
    - {name: set_param,      proto_id: 2,  body: SetParam,      kind: handler, response: ack}
    - {name: get_param,      proto_id: 3,  body: GetParam,      kind: handler, response: config_dump}
    - {name: get_info,       proto_id: 4,  body: GetInfo,       kind: handler, response: info}
    - {name: get_config,     proto_id: 5,  body: GetConfig,     kind: handler, response: config_dump}
    - {name: settings_save,  proto_id: 6,  body: SettingsSave,  kind: action,  action: SETTINGS_SAVE, response: ack}
    - {name: reboot,         proto_id: 7,  body: Reboot,        kind: action,  action: REBOOT, response: ack}
    - {name: factory_reset,  proto_id: 8,  body: FactoryReset,  kind: action,  action: FACTORY_RESET, response: ack}
    - {name: force_send,     proto_id: 9,  body: ForceSend,     kind: handler, response: none, transports: [lrw]}
    - {name: reset_counters, proto_id: 10, body: ResetCounters, kind: handler, response: ack}
    - {name: req_history,    proto_id: 11, body: ReqHistory,    kind: handler, response: none, transports: [lrw]}
    - {name: clock_sync,     proto_id: 12, body: ClockSync,     kind: handler, response: info_deferred, transports: [lrw, nfc]}
    - {name: w1_scan,        proto_id: 14, body: W1Scan,        kind: handler, response: w1_scan}
    - {name: lrw_reset,      proto_id: 16, body: LrwReset,      kind: action,  action: LRW_RESET, response: ack}
    - {name: lrw_join,       proto_id: 17, body: LrwJoin,       kind: action,  action: LRW_JOIN, response: ack}
    - {name: enter_calibration, proto_id: 18, body: EnterCalibration, kind: action, action: ENTER_CALIBRATION, response: ack, transports: [lrw, nfc]}
    - {name: enter_mailbox,  proto_id: 19, body: EnterMailbox,  kind: action,  action: ENTER_MAILBOX, response: ack, transports: [nfc]}
    - {name: exit_mailbox,   proto_id: 20, body: ExitMailbox,   kind: action,  action: LEAVE_MAILBOX, response: ack, transports: [nfc]}
parameters:
  - name: secret_key
    proto_group: root
    proto_id: 2
    dump: false
    proto_callback: true
    type: bytes
    size: 16
    preserve_on_reset: true
    help: "Get/Set device secret key (32 hexadecimal digits)."

  - name: serial_number
    proto_group: root
    proto_id: 3
    type: uint32
    format: "%010u"
    preserve_on_reset: true
    help: "Get/Set device serial number (10 decimal digits)."
    extras:
      digits: 10

  - name: nonce_counter
    proto_group: root
    proto_id: 4
    type: uint32
    preserve_on_reset: true
    help: "Get/Set nonce counter (unsigned integer)."

  # Device claim token (#170): 128-bit identity, on the same level as
  # serial_number. Written ONCE during commissioning via `config claim-token`
  # and then immutable (write_once latch in the shell setter — the only write
  # path; root fields are not in SetParam). Read back over NFC + LoRaWAN via the
  # get_info Info message. Off the wire in AppConfigMessage (proto_callback, like
  # secret_key); preserved across reset, cleared only by a full NVS erase.
  - name: claim_token
    proto_group: root
    proto_id: 9
    dump: false
    proto_callback: true
    type: bytes
    size: 16
    write_once: true
    preserve_on_reset: true
    help: "Get/Set device claim token (32 hexadecimal digits); write-once at commissioning."

  - name: calibration
    proto_group: application
    proto_id: 1
    type: bool
    help: "Get/Set calibration mode (true/false)."

  - name: interval_sample
    proto_group: application
    proto_id: 2
    type: int
    min: 5
    max: 3600
    help: "Get/Set sample interval (range 5 to 3600 seconds; 0 = precede report)."
    extras:
      zero_allowed: true

  - name: interval_report
    proto_group: application
    proto_id: 3
    type: int
    default: 900
    min: 60
    max: 86400
    help: "Get/Set report interval (range 60 to 86400 seconds)."

  - name: history_enable
    proto_group: application
    proto_id: 4
    type: bool
    default: false
    help: "Get/Set sensor history store-and-forward (true/false)."

  - name: history_sensors
    proto_group: application
    proto_id: 5
    type: uint32
    default: 0
    help: "Get/Set history sensor selection bitmask (0 = all capability-available)."

  - name: alarm_limit
    proto_group: alarms
    proto_id: 1
    type: int
    default: 0
    min: 0
    max: 3600
    help: "Get/Set minimum interval between alarm uplinks in seconds (0 = disabled)."

  - name: alarm_notif_time
    proto_group: alarms
    proto_id: 2
    type: int
    default: 10
    min: 1
    max: 60
    help: "Get/Set alarm red-LED hold time in seconds (both-mode and pulse sources)."

  - name: lrw_region
    proto_group: lorawan
    proto_id: 1
    type: enum
    enum: lrw_region
    preserve_on_reset: true
    help: "Get/Set LoRaWAN region (eu868/us915/au915)."

  - name: lrw_sub_band
    proto_group: lorawan
    proto_id: 2
    type: int
    default: 2
    min: 0
    max: 8
    preserve_on_reset: true
    help: "Get/Set US915/AU915 sub-band (1-8, 0 = all channels). Default 2 matches TTN/Helium/ChirpStack."

  - name: lrw_network
    proto_group: lorawan
    proto_id: 3
    type: enum
    enum: lrw_network
    preserve_on_reset: true
    help: "Get/Set LoRaWAN network (public/private)."

  - name: lrw_adr
    proto_group: lorawan
    proto_id: 4
    type: bool
    preserve_on_reset: true
    help: "Get/Set LoRaWAN ADR (true/false)."

  - name: lrw_activation
    proto_group: lorawan
    proto_id: 5
    type: enum
    enum: lrw_activation
    preserve_on_reset: true
    help: "Get/Set LoRaWAN activation (otaa/abp)."

  - name: lrw_deveui
    proto_group: lorawan
    proto_id: 6
    type: bytes
    size: 8
    preserve_on_reset: true
    help: "Get/Set LoRaWAN DevEUI (16 hex digits)."

  - name: lrw_joineui
    proto_group: lorawan
    proto_id: 7
    type: bytes
    size: 8
    preserve_on_reset: true
    help: "Get/Set LoRaWAN JoinEUI (16 hex digits)."

  - name: lrw_nwkkey
    proto_group: lorawan
    proto_id: 8
    dump: false
    dump_nfc_only: true
    type: bytes
    size: 16
    preserve_on_reset: true
    help: "Get/Set LoRaWAN NwkKey (32 hex digits)."

  - name: lrw_appkey
    proto_group: lorawan
    proto_id: 9
    dump: false
    dump_nfc_only: true
    type: bytes
    size: 16
    preserve_on_reset: true
    help: "Get/Set LoRaWAN AppKey (32 hex digits)."

  - name: lrw_devaddr
    proto_group: lorawan
    proto_id: 10
    type: bytes
    size: 4
    preserve_on_reset: true
    help: "Get/Set LoRaWAN DevAddr (8 hex digits)."

  - name: lrw_nwkskey
    proto_group: lorawan
    proto_id: 11
    dump: false
    dump_nfc_only: true
    type: bytes
    size: 16
    preserve_on_reset: true
    help: "Get/Set LoRaWAN NwkSKey (32 hexadecimal digits)."

  - name: lrw_appskey
    proto_group: lorawan
    proto_id: 12
    dump: false
    dump_nfc_only: true
    type: bytes
    size: 16
    preserve_on_reset: true
    help: "Get/Set LoRaWAN AppSKey (32 hexadecimal digits)."

  - name: lrw_link_check_interval
    proto_group: lorawan
    proto_id: 13
    type: int
    default: 5
    min: 0
    max: 255
    help: "Get/Set link-check cadence: request a LinkCheckReq every N-th uplink (0 = disabled)."

  - name: lrw_link_check_fail_rejoin
    proto_group: lorawan
    proto_id: 14
    type: int
    default: 5
    min: 1
    max: 255
    help: "Get/Set link-check failures (while degraded) before an OTAA rejoin is attempted."

  - name: cap_hall_left
    proto_group: sensors
    proto_id: 1
    type: bool
    help: "Get/Set hall left capability (true/false)."

  - name: cap_hall_right
    proto_group: sensors
    proto_id: 2
    type: bool
    help: "Get/Set hall right capability (true/false)."

  - name: cap_input_a
    proto_group: sensors
    proto_id: 3
    type: bool
    help: "Get/Set input A capability (true/false)."

  - name: cap_input_b
    proto_group: sensors
    proto_id: 4
    type: bool
    help: "Get/Set input B capability (true/false)."

  - name: cap_light_sensor
    proto_group: sensors
    proto_id: 5
    type: bool
    help: "Get/Set light sensor capability (true/false)."

  - name: cap_barometer
    proto_group: sensors
    proto_id: 6
    type: bool
    help: "Get/Set barometer capability (true/false)."

  - name: cap_pir_detector
    proto_group: sensors
    proto_id: 7
    type: bool
    help: "Get/Set PIR detector capability (true/false)."

  - name: cap_w1_sensors
    proto_group: sensors
    proto_id: 8
    type: bool
    help: "Get/Set 1-Wire sensor bus capability — enables the bus + auto-detects attached sensors (true/false)."

  - name: cap_accelerometer
    proto_group: sensors
    proto_id: 9
    type: bool
    help: "Get/Set accelerometer capability — orientation, motion and free-fall (true/false)."

  - name: hall_left_counter
    proto_group: alarms
    proto_id: 3
    type: bool
    help: "Get/Set hall left switch counter enabled (true/false)."

  - name: hall_right_counter
    proto_group: alarms
    proto_id: 4
    type: bool
    help: "Get/Set hall right switch counter enabled (true/false)."

  - name: input_a_counter
    proto_group: alarms
    proto_id: 5
    type: bool
    help: "Get/Set input A counter enabled (true/false)."

  - name: input_b_counter
    proto_group: alarms
    proto_id: 6
    type: bool
    help: "Get/Set input B counter enabled (true/false)."

  # Dynamic alarm rule slots. One packed-hex rule per slot (the slot index is the
  # rule's stable identity). 17 bytes little-endian:
  #   [0] flags  bit0=present (slot occupied), bit1=enabled
  #   [1] source (enum app_alarm_source)
  #   [2] quantity (enum app_alarm_quantity)
  #   [3] from_state, [4] to_state (STATE only)
  #   [5..8] lo, [9..12] hi, [13..16] hst (IEEE-754 float LE)
  # An empty slot is 34 zero hex chars (present=0). The rule cache in
  # app_alarm_rules.c is rebuilt from these on load and after every SetParam.
  - name: alarm_0
    proto_group: alarms
    proto_id: 7
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 0 (packed hex, see app_config.yml)."

  - name: alarm_1
    proto_group: alarms
    proto_id: 8
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 1 (packed hex, see app_config.yml)."

  - name: alarm_2
    proto_group: alarms
    proto_id: 9
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 2 (packed hex, see app_config.yml)."

  - name: alarm_3
    proto_group: alarms
    proto_id: 10
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 3 (packed hex, see app_config.yml)."

  - name: alarm_4
    proto_group: alarms
    proto_id: 11
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 4 (packed hex, see app_config.yml)."

  - name: alarm_5
