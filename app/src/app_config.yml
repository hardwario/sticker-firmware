  - name: alarm_9
    proto_group: alarms
    proto_id: 16
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 9 (packed hex, see app_config.yml)."

  - name: alarm_10
    proto_group: alarms
    proto_id: 17
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 10 (packed hex, see app_config.yml)."

  - name: alarm_11
    proto_group: alarms
    proto_id: 18
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 11 (packed hex, see app_config.yml)."

  - name: alarm_12
    proto_group: alarms
    proto_id: 19
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 12 (packed hex, see app_config.yml)."

  - name: alarm_13
    proto_group: alarms
    proto_id: 20
    type: bytes
    size: 17
    no_shell: true
    help: "Get/Set alarm rule slot 13 (packed hex, see app_config.yml)."

  - name: alarm_14
