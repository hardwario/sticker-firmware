version: 1

module:
  name: app_config
  settings_prefix: config
  shell_command: config
  log_module: app_config
  version: 2

enums:
  lrw_region:
    - name: EU868
      value: 0
      shell: eu868
    - name: US915
      value: 1
      shell: us915
    - name: AU915
      value: 2
      shell: au915

  lrw_network:
    - name: PUBLIC
      value: 0
      shell: public
    - name: PRIVATE
      value: 1
      shell: private

  lrw_activation:
    - name: OTAA
      value: 0
      shell: otaa
    - name: ABP
      value: 1
      shell: abp

proto:
  message: AppConfigMessage
  extra_fields:
    - {name: factory, type: bool, proto_id: 1, proto_group: root}
  groups:
    - {key: root}
    - {key: lorawan, message: Lorawan, field: lorawan, proto_id: 5, strip_prefix: lrw_}
    - {key: application, message: Application, field: application, proto_id: 6, reserved: [3]}
parameters:
  - name: secret_key
    proto_group: root
    proto_id: 2
    proto_callback: true
    type: bytes
    size: 16
    help: "Get/Set device secret key (32 hexadecimal digits)."

  - name: serial_number
    proto_group: root
    proto_id: 3
    type: uint32
    format: "%010u"
    help: "Get/Set device serial number (10 decimal digits)."
    extras:
      digits: 10

  - name: nonce_counter
    proto_group: root
    proto_id: 4
    type: uint32
    help: "Get/Set nonce counter (unsigned integer)."

  - name: calibration
    proto_group: application
    proto_id: 1
    type: bool
    help: "Get/Set calibration mode (true/false)."

  - name: interval_sample
    proto_group: application
    proto_id: 2
    type: int
    min: 5
    max: 3600
    help: "Get/Set sample interval (range 5 to 3600 seconds; 0 = precede report)."
    extras:
      zero_allowed: true

  - name: interval_report
    proto_group: application
    proto_id: 4
    type: int
    default: 900
    min: 60
    max: 86400
    help: "Get/Set report interval (range 60 to 86400 seconds)."

  - name: lrw_region
    proto_group: lorawan
    proto_id: 1
    type: enum
    enum: lrw_region
    help: "Get/Set LoRaWAN region (eu868/us915/au915)."

  - name: lrw_sub_band
    proto_group: lorawan
    proto_id: 12
    type: int
    default: 2
    min: 0
    max: 8
    help: "Get/Set US915/AU915 sub-band (1-8, 0 = all channels). Default 2 matches TTN/Helium/ChirpStack."

  - name: lrw_network
    proto_group: lorawan
    proto_id: 2
    type: enum
    enum: lrw_network
    help: "Get/Set LoRaWAN network (public/private)."

  - name: lrw_adr
    proto_group: lorawan
    proto_id: 3
    type: bool
    help: "Get/Set LoRaWAN ADR (true/false)."

  - name: lrw_activation
    proto_group: lorawan
    proto_id: 4
    type: enum
    enum: lrw_activation
    help: "Get/Set LoRaWAN activation (otaa/abp)."

  - name: lrw_deveui
    proto_group: lorawan
    proto_id: 5
    type: bytes
    size: 8
    help: "Get/Set LoRaWAN DevEUI (16 hex digits)."

  - name: lrw_joineui
    proto_group: lorawan
    proto_id: 6
    type: bytes
    size: 8
    help: "Get/Set LoRaWAN JoinEUI (16 hex digits)."

  - name: lrw_nwkkey
    proto_group: lorawan
    proto_id: 7
    type: bytes
    size: 16
    help: "Get/Set LoRaWAN NwkKey (32 hex digits)."

  - name: lrw_appkey
    proto_group: lorawan
    proto_id: 8
    type: bytes
    size: 16
    help: "Get/Set LoRaWAN AppKey (32 hex digits)."

  - name: lrw_devaddr
    proto_group: lorawan
    proto_id: 9
    type: bytes
    size: 4
    help: "Get/Set LoRaWAN DevAddr (8 hex digits)."

  - name: lrw_nwkskey
    proto_group: lorawan
    proto_id: 10
    type: bytes
    size: 16
    help: "Get/Set LoRaWAN NwkSKey (32 hexadecimal digits)."

  - name: lrw_appskey
    proto_group: lorawan
    proto_id: 11
    type: bytes
    size: 16
    help: "Get/Set LoRaWAN AppSKey (32 hexadecimal digits)."

  - name: alarm_temperature_enabled
    proto_group: application
    proto_id: 5
    type: bool
    help: "Get/Set temperature alarm enabled (true/false)."

  - name: alarm_temperature_lo
    proto_group: application
    proto_id: 6
    type: float
    default: 15.0
    min: -30.0
    max: 70.0
    help: "Get/Set temperature low threshold (-30 to 70 deg. C)."

  - name: alarm_temperature_hi
    proto_group: application
    proto_id: 7
    type: float
    default: 25.0
    min: -30.0
    max: 70.0
