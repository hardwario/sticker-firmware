    no_shell: true
    help: "Get/Set alarm rule slot 15 (packed hex, see app_config.yml)."

  - name: accel_motion_sensitivity
    proto_group: sensors
    proto_id: 10
    type: enum
    enum: motion_sensitivity
    default: "off"
    help: "Get/Set accelerometer motion detection sensitivity (off/low/medium/high)."

  # --- 1-Wire sensor slots (1wire-sensors) --------------------------------
  # Each slot binds a physical 1-Wire sensor to a logical position by its ROM
  # serial (stable across reboots/rescans). ONLY the ROM is persisted — the
  # sensor type (dallas / machine-probe / …) and SHT variant are auto-detected
  # at runtime from the ROM family code during the bus scan. all-zero = empty.
  - name: sensor1_rom
    proto_group: sensors
    proto_id: 11
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 1 ROM (16 hex digits; all-zero = empty)."
  - name: sensor2_rom
    proto_group: sensors
    proto_id: 12
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 2 ROM (16 hex digits; all-zero = empty)."
  - name: sensor3_rom
    proto_group: sensors
    proto_id: 13
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 3 ROM (16 hex digits; all-zero = empty)."
  - name: sensor4_rom
    proto_group: sensors
    proto_id: 14
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 4 ROM (16 hex digits; all-zero = empty)."
