  # --- 1-Wire sensor slots (1wire-sensor-framework, P1) -------------------
  # Per-slot ROM identity + auto-detected type, for stable ROM-bound binding
  # (replaces discovery-order binding). type: 0=empty, 1=dallas-thermometer,
  # 2=machine-probe. sht: cached SHT variant for machine-probe (0=unknown).
  # Slots are flat-numbered (configen has no repeated config fields).
  - name: sensor1_rom
    proto_group: application
    proto_id: 54
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 1 ROM (16 hex digits; all-zero = empty)."
  - name: sensor1_type
    proto_group: application
    proto_id: 55
    type: uint32
    help: "Get/Set 1-Wire slot 1 type (0=empty,1=dallas,2=machine-probe)."
  - name: sensor1_sht
    proto_group: application
    proto_id: 56
    type: uint32
    help: "Get/Set 1-Wire slot 1 SHT variant cache (0=unknown)."

  - name: sensor2_rom
    proto_group: application
    proto_id: 57
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 2 ROM (16 hex digits; all-zero = empty)."
