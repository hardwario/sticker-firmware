version: 1

module:
  name: app_config
  settings_prefix: config
  shell_command: config
  log_module: app_config
  version: 2

enums:
  lrw_region:
    - name: EU868
      value: 0
      shell: eu868
    - name: US915
      value: 1
      shell: us915
    - name: AU915
      value: 2
      shell: au915

  lrw_network:
    - name: PUBLIC
      value: 0
      shell: public
    - name: PRIVATE
      value: 1
      shell: private

  lrw_activation:
    - name: OTAA
      value: 0
      shell: otaa
    - name: ABP
      value: 1
      shell: abp

  motion_sensitivity:
    - name: "OFF"
      value: 0
      shell: "off"
    - name: LOW
      value: 1
      shell: low
    - name: MEDIUM
      value: 2
      shell: medium
    - name: HIGH
      value: 3
      shell: high

proto:
  message: AppConfigMessage
  extra_fields:
    - {name: factory, type: bool, proto_id: 1, proto_group: root}
  groups:
    - {key: root}
    - {key: lorawan, message: Lorawan, field: lorawan, proto_id: 5, strip_prefix: lrw_}
    - {key: application, message: Application, field: application, proto_id: 6, reserved: [3, 47, 48]}
parameters:
  - name: secret_key
    proto_group: root
    proto_id: 2
    proto_callback: true
    type: bytes
    size: 16
    preserve_on_migration: true
    help: "Get/Set device secret key (32 hexadecimal digits)."

  - name: serial_number
    proto_group: root
    proto_id: 3
    type: uint32
    format: "%010u"
    preserve_on_migration: true
    help: "Get/Set device serial number (10 decimal digits)."
    extras:
      digits: 10

  - name: nonce_counter
    proto_group: root
    proto_id: 4
    type: uint32
    preserve_on_migration: true
    help: "Get/Set nonce counter (unsigned integer)."

  - name: calibration
    proto_group: application
    proto_id: 1
    type: bool
    help: "Get/Set calibration mode (true/false)."

  - name: interval_sample
    proto_group: application
    proto_id: 2
    type: int
    min: 5
    max: 3600
    help: "Get/Set sample interval (range 5 to 3600 seconds; 0 = precede report)."
    extras:
      zero_allowed: true

  - name: interval_report
    proto_group: application
    proto_id: 4
    type: int
    default: 900
    min: 60
    max: 86400
    help: "Get/Set report interval (range 60 to 86400 seconds)."

  - name: history_enable
    proto_group: application
    proto_id: 49
    type: bool
    default: false
    help: "Get/Set sensor history store-and-forward (true/false)."

  - name: history_sensors
    proto_group: application
    proto_id: 50
    type: uint32
    default: 0
    help: "Get/Set history sensor selection bitmask (0 = all capability-available)."

  - name: alarm_limit
    proto_group: application
    proto_id: 51
    type: int
    default: 0
    min: 0
    max: 3600
    help: "Get/Set minimum interval between alarm uplinks in seconds (0 = disabled)."

  - name: alarm_notif_time
    proto_group: application
    proto_id: 52
    type: int
    default: 10
    min: 1
    max: 60
    help: "Get/Set alarm red-LED hold time in seconds (both-mode and pulse sources)."

  - name: lrw_region
    proto_group: lorawan
    proto_id: 1
    type: enum
    enum: lrw_region
    preserve_on_migration: true
    help: "Get/Set LoRaWAN region (eu868/us915/au915)."

  - name: lrw_sub_band
    proto_group: lorawan
    proto_id: 12
    type: int
    default: 2
    min: 0
    max: 8
    preserve_on_migration: true
    help: "Get/Set US915/AU915 sub-band (1-8, 0 = all channels). Default 2 matches TTN/Helium/ChirpStack."

  - name: lrw_network
    proto_group: lorawan
    proto_id: 2
    type: enum
    enum: lrw_network
    preserve_on_migration: true
    help: "Get/Set LoRaWAN network (public/private)."

  - name: lrw_adr
    proto_group: lorawan
    proto_id: 3
    type: bool
    preserve_on_migration: true
    help: "Get/Set LoRaWAN ADR (true/false)."

  - name: lrw_activation
    proto_group: lorawan
    proto_id: 4
    type: enum
    enum: lrw_activation
    preserve_on_migration: true
    help: "Get/Set LoRaWAN activation (otaa/abp)."

  - name: lrw_deveui
    proto_group: lorawan
    proto_id: 5
    type: bytes
    size: 8
    preserve_on_migration: true
    help: "Get/Set LoRaWAN DevEUI (16 hex digits)."

  - name: lrw_joineui
    proto_group: lorawan
    proto_id: 6
    type: bytes
    size: 8
    preserve_on_migration: true
    help: "Get/Set LoRaWAN JoinEUI (16 hex digits)."

  - name: lrw_nwkkey
    proto_group: lorawan
    proto_id: 7
    type: bytes
    size: 16
    preserve_on_migration: true
    help: "Get/Set LoRaWAN NwkKey (32 hex digits)."

  - name: lrw_appkey
    proto_group: lorawan
    proto_id: 8
    type: bytes
    size: 16
    preserve_on_migration: true
    help: "Get/Set LoRaWAN AppKey (32 hex digits)."

  - name: lrw_devaddr
    proto_group: lorawan
    proto_id: 9
    type: bytes
    size: 4
    preserve_on_migration: true
    help: "Get/Set LoRaWAN DevAddr (8 hex digits)."

  - name: lrw_nwkskey
    proto_group: lorawan
    proto_id: 10
    type: bytes
    size: 16
    preserve_on_migration: true
    help: "Get/Set LoRaWAN NwkSKey (32 hexadecimal digits)."

  - name: lrw_appskey
    proto_group: lorawan
    proto_id: 11
    type: bytes
    size: 16
    preserve_on_migration: true
    help: "Get/Set LoRaWAN AppSKey (32 hexadecimal digits)."

  - name: cap_hall_left
    proto_group: application
    proto_id: 40
    type: bool
    help: "Get/Set hall left capability (true/false)."

  - name: cap_hall_right
    proto_group: application
    proto_id: 41
    type: bool
    help: "Get/Set hall right capability (true/false)."

  - name: cap_input_a
    proto_group: application
    proto_id: 42
    type: bool
    help: "Get/Set input A capability (true/false)."

  - name: cap_input_b
    proto_group: application
    proto_id: 43
    type: bool
    help: "Get/Set input B capability (true/false)."

  - name: cap_light_sensor
    proto_group: application
    proto_id: 44
    type: bool
    help: "Get/Set light sensor capability (true/false)."

  - name: cap_barometer
    proto_group: application
    proto_id: 45
    type: bool
    help: "Get/Set barometer capability (true/false)."

  - name: cap_pir_detector
    proto_group: application
    proto_id: 46
    type: bool
    help: "Get/Set PIR detector capability (true/false)."

  - name: cap_w1_sensors
    proto_group: application
    proto_id: 60
    type: bool
    help: "Get/Set 1-Wire sensor bus capability — enables the bus + auto-detects attached sensors (true/false)."

  - name: cap_accelerometer
    proto_group: application
    proto_id: 55
    type: bool
    help: "Get/Set accelerometer capability — orientation, motion and free-fall (true/false)."

  - name: temperature_alarm_enabled
    proto_group: application
    proto_id: 5
    type: bool
    help: "Get/Set temperature alarm enabled (true/false)."

  - name: temperature_alarm_lo
    proto_group: application
    proto_id: 6
    type: float
    default: 15.0
    min: -30.0
    max: 70.0
    help: "Get/Set temperature low threshold (-30 to 70 deg. C)."

  - name: temperature_alarm_hi
    proto_group: application
    proto_id: 7
    type: float
    default: 25.0
    min: -30.0
    max: 70.0
    help: "Get/Set temperature high threshold (-30 to 70 deg. C)."

  - name: temperature_alarm_hst
    proto_group: application
    proto_id: 8
    type: float
    default: 0.5
    min: 0.0
    max: 5.0
    help: "Get/Set temperature hysteresis (0 to 5 deg. C)."

  - name: humidity_alarm_enabled
    proto_group: application
    proto_id: 9
    type: bool
    help: "Get/Set humidity alarm enabled (true/false)."

  - name: humidity_alarm_lo
    proto_group: application
    proto_id: 10
    type: float
    default: 30.0
    min: 0.0
    max: 100.0
    help: "Get/Set humidity low threshold (0 to 100 %)."

  - name: humidity_alarm_hi
    proto_group: application
    proto_id: 11
    type: float
    default: 75.0
    min: 0.0
    max: 100.0
    help: "Get/Set humidity high threshold (0 to 100 %)."

  - name: humidity_alarm_hst
    proto_group: application
    proto_id: 12
    type: float
    default: 5.0
    min: 0.0
    max: 20.0
    help: "Get/Set humidity hysteresis (0 to 20 %)."

  - name: pressure_alarm_enabled
    proto_group: application
    proto_id: 13
    type: bool
    help: "Get/Set pressure alarm enabled (true/false)."

  - name: pressure_alarm_lo
    proto_group: application
    proto_id: 14
    type: float
    default: 700.0
    min: 500.0
    max: 1200.0
    help: "Get/Set pressure low threshold (500 to 1200 hPa)."

  - name: pressure_alarm_hi
    proto_group: application
    proto_id: 15
    type: float
    default: 1060.0
    min: 500.0
    max: 1200.0
    help: "Get/Set pressure high threshold (500 to 1200 hPa)."

  - name: pressure_alarm_hst
    proto_group: application
    proto_id: 16
    type: float
    default: 10.0
    min: 0.0
    max: 50.0
    help: "Get/Set pressure hysteresis (0 to 50 hPa)."

  - name: t1_alarm_enabled
    proto_group: application
    proto_id: 17
    type: bool
    help: "Get/Set T1 temperature alarm enabled (true/false)."

  - name: t1_alarm_lo
    proto_group: application
    proto_id: 18
    type: float
    default: 15.0
    min: -30.0
    max: 70.0
    help: "Get/Set T1 temperature low threshold (-30 to 70 deg. C)."

  - name: t1_alarm_hi
    proto_group: application
    proto_id: 19
    type: float
    default: 25.0
    min: -30.0
    max: 70.0
    help: "Get/Set T1 temperature high threshold (-30 to 70 deg. C)."

  - name: t1_alarm_hst
    proto_group: application
    proto_id: 20
    type: float
    default: 0.5
    min: 0.0
    max: 5.0
    help: "Get/Set T1 temperature hysteresis (0 to 5 deg. C)."

  - name: t2_alarm_enabled
    proto_group: application
    proto_id: 21
    type: bool
    help: "Get/Set T2 temperature alarm enabled (true/false)."

  - name: t2_alarm_lo
    proto_group: application
    proto_id: 22
    type: float
    default: 15.0
    min: -30.0
    max: 70.0
    help: "Get/Set T2 temperature low threshold (-30 to 70 deg. C)."

  - name: t2_alarm_hi
    proto_group: application
    proto_id: 23
    type: float
    default: 25.0
    min: -30.0
    max: 70.0
    help: "Get/Set T2 temperature high threshold (-30 to 70 deg. C)."

  - name: t2_alarm_hst
    proto_group: application
    proto_id: 24
    type: float
    default: 0.5
    min: 0.0
    max: 5.0
    help: "Get/Set T2 temperature hysteresis (0 to 5 deg. C)."

  - name: hall_left_counter
    proto_group: application
    proto_id: 25
    type: bool
    help: "Get/Set hall left switch counter enabled (true/false)."

  - name: hall_left_notify_act
    proto_group: application
    proto_id: 26
    type: bool
    help: "Get/Set hall left switch notify on activation (true/false)."

  - name: hall_left_notify_deact
    proto_group: application
    proto_id: 27
    type: bool
    help: "Get/Set hall left switch notify on deactivation (true/false)."

  - name: hall_right_counter
    proto_group: application
    proto_id: 28
    type: bool
    help: "Get/Set hall right switch counter enabled (true/false)."

  - name: hall_right_notify_act
    proto_group: application
    proto_id: 29
    type: bool
    help: "Get/Set hall right switch notify on activation (true/false)."

  - name: hall_right_notify_deact
    proto_group: application
    proto_id: 30
    type: bool
    help: "Get/Set hall right switch notify on deactivation (true/false)."

  - name: input_a_counter
    proto_group: application
    proto_id: 31
    type: bool
    help: "Get/Set input A counter enabled (true/false)."

  - name: input_a_notify_act
    proto_group: application
    proto_id: 32
    type: bool
    help: "Get/Set input A notify on activation (true/false)."

  - name: input_a_notify_deact
    proto_group: application
    proto_id: 33
    type: bool
    help: "Get/Set input A notify on deactivation (true/false)."

  - name: input_b_counter
    proto_group: application
    proto_id: 34
    type: bool
    help: "Get/Set input B counter enabled (true/false)."

  - name: input_b_notify_act
    proto_group: application
    proto_id: 35
    type: bool
    help: "Get/Set input B notify on activation (true/false)."

  - name: input_b_notify_deact
    proto_group: application
    proto_id: 36
    type: bool
    help: "Get/Set input B notify on deactivation (true/false)."

  - name: temperature_corr
    proto_group: application
    proto_id: 37
    type: float
    min: -5.0
    max: 5.0
    help: "Get/Set temperature correction (range -5.0 to +5.0 deg. C)."

  - name: t1_corr
    proto_group: application
    proto_id: 38
    type: float
    min: -5.0
    max: 5.0
    help: "Get/Set T1 temperature correction (range -5.0 to +5.0 deg. C)."

  - name: t2_corr
    proto_group: application
    proto_id: 39
    type: float
    min: -5.0
    max: 5.0
    help: "Get/Set T2 temperature correction (range -5.0 to +5.0 deg. C)."

  - name: pir_notify_act
    proto_group: application
    proto_id: 53
    type: bool
    default: false
    help: "Get/Set PIR motion alarm notify on activation (true/false)."

  - name: accel_motion_sensitivity
    proto_group: application
    proto_id: 54
    type: enum
    enum: motion_sensitivity
    default: "off"
    help: "Get/Set accelerometer motion detection sensitivity (off/low/medium/high)."

  # --- 1-Wire sensor slots (1wire-sensors) --------------------------------
  # Each slot binds a physical 1-Wire sensor to a logical position by its ROM
  # serial (stable across reboots/rescans). ONLY the ROM is persisted — the
  # sensor type (dallas / machine-probe / …) and SHT variant are auto-detected
  # at runtime from the ROM family code during the bus scan. all-zero = empty.
  - name: sensor1_rom
    proto_group: application
    proto_id: 56
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 1 ROM (16 hex digits; all-zero = empty)."
  - name: sensor2_rom
    proto_group: application
    proto_id: 57
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 2 ROM (16 hex digits; all-zero = empty)."
  - name: sensor3_rom
    proto_group: application
    proto_id: 58
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 3 ROM (16 hex digits; all-zero = empty)."
  - name: sensor4_rom
    proto_group: application
    proto_id: 59
    type: bytes
    size: 8
    help: "Get/Set 1-Wire slot 4 ROM (16 hex digits; all-zero = empty)."
