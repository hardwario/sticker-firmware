# P2P two-STICKER bench overlay for the DUT (#118, doc/p2p.md §14) -- layer
# this ON TOP of debug.conf:
#
#   west build -b sticker sticker/app -- \
#     -DEXTRA_CONF_FILE="debug.conf;debug_p2p_bench.conf"
#
# debug.conf alone drops CONFIG_RADIO_P2P (doc/p2p.md §11: the near-full
# debug image has no headroom for the dual-stack addition). This overlay flips
# it back on for bench testing and trims enough elsewhere to fit -- shell/RTT
# stay fully enabled (that IS the test's UI), history/watchdog/log depth are
# what give up the room, since none of them are under test here.
#
# Bench-only: do not use for anything other than the two-STICKER P2P rig.
#
# 2026-08-18 HIL finding: the previous ~170 B "free" margin (per the linker's
# own static RAM report) was NOT a safe margin in practice -- a two-STICKER
# bench session hit reproducible BusFault/UsageFault crashes on real HW with
# the fault address landing exactly at/past the top of RAM (0x20010000 on
# this 64 KB part), both with and without CONFIG_RADIO_P2P=y (i.e. this is
# a general debug.conf RAM-exhaustion issue, not a P2P-specific bug -- tracked
# separately). Whatever lands last during static linking only had ~20-170 B
# to work with, which some runtime-computed structure (heap init, chunk
# bookkeeping, etc.) doesn't fit into. Trimmed further below for a real
# multi-hundred-byte margin instead of a barely-positive one.
CONFIG_RADIO_P2P=y

# History isn't under test; shrink the RAM ring (debug.conf already keeps
# history in RAM, CONFIG_APP_HISTORY_FLASH=n) to the smallest practical size.
CONFIG_APP_HISTORY_BYTES=32

# Watchdog isn't needed for an interactive bench session (no unattended
# operation to protect) and its callers are already CONFIG_WATCHDOG-guarded
# throughout (app_lrw.c, app_p2p.c, main.c), so disabling it is safe.
CONFIG_WATCHDOG=n

# Deferred-logging buffers: still enough for the P2P module's own LOG_INF
# lines (frame hex dumps top out around ~500 B, larger than any single log
# buffer here, but the ring drains continuously so this is about steady-state
# capacity, not one message's worst case) at roughly a third of debug.conf's
# sizing (cut further than the original half after the crash above).
CONFIG_LOG_BUFFER_SIZE=256
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1280
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=384

# Join handshake (#118 phase 2) pushed this overlay over its flash budget by
# ~900 B. Shell --help text (CONFIG_SHELL_HELP, on via debug.conf) is a sizable
# flash cost across every shell command in the image, none of which this bench
# rig's operator needs interactively (doc/p2p.md §14's commands are already
# scripted/known) -- disabling it is the cheapest lever that doesn't touch any
# code actually under test here.
CONFIG_SHELL_HELP=n

# The single biggest remaining lever (#118 phase 2 flash budget, requested
# ahead of the §6 Ack/retry work): this bench rig only ever exercises P2P
# (radio_mode always p2p), so the LoRaWAN protocol stack itself is dead
# weight here -- ~41 KB flash / ~15 KB RAM per issue #395's measurement on
# the (separate, unmerged) sticker-debug-variants branch. Needed guards in
# app_radio.c (LoRaWAN-fallback calls), main.c (LRW_RESET/LRW_JOIN
# deferred-NFC actions), app_calibration.c (cal-mode uplink handoff), and
# app/CMakeLists.txt (app_report.c moved to unconditional compilation,
# since it owns the sample/history cadence via app_radio, not just the
# LoRaWAN uplink) -- see those commits for #118 phase 2. CONFIG_LORA stays
# on (P2P's own raw-radio driver dependency); only the LoRaWAN protocol
# layer goes.
#
# Turned off via the app-level CONFIG_RADIO_LORAWAN, NOT by assigning
# CONFIG_LORAWAN=n directly (which is what this line used to do, before
# #395 landed on v1.5.0): CONFIG_RADIO_LORAWAN now `select`s LORAWAN, and a
# Kconfig `select` beats an assignment, so the direct form would be silently
# overridden back to y with only a warning.
CONFIG_RADIO_LORAWAN=n

# main() only runs the sequential *_init() calls (LoRaWAN/P2P/report/sensor/
# NFC/etc. each hand off to their own dedicated thread or work queue almost
# immediately) -- it does not need prj.conf's project-wide 4096 B, which is
# sized for release/other configs with much more RAM headroom. Cut to 3072 B
# (a modest 25% trim, not a guess at the theoretical minimum) purely to buy
# real static RAM margin in this already near-limit bench build.
# NOTE: unlike the buffer/pool trims above (deterministic max usage), this is
# a THREAD STACK size and its safety depends on main()'s actual call depth --
# re-verify on HW (e.g. CONFIG_INIT_STACKS + CONFIG_THREAD_STACK_INFO, both
# already on via debug.conf) before trusting it long-term.
CONFIG_MAIN_STACK_SIZE=3072
