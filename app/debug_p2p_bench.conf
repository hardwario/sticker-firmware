# P2P two-STICKER bench overlay for the DUT (#118, doc/p2p.md §14) -- layer
# this ON TOP of debug.conf:
#
#   west build -b sticker sticker/app -- \
#     -DEXTRA_CONF_FILE="debug.conf;debug_p2p_bench.conf"
#
# debug.conf alone drops CONFIG_APP_LORA_P2P (doc/p2p.md §11: the near-full
# debug image has no headroom for the dual-stack addition). This overlay flips
# it back on for bench testing and trims enough elsewhere to fit -- shell/RTT
# stay fully enabled (that IS the test's UI), history/watchdog/log depth are
# what give up the room, since none of them are under test here.
#
# Bench-only: do not use for anything other than the two-STICKER P2P rig. It
# is razor-thin (~170 B RAM headroom) and its trims are chosen for THIS test,
# not general-purpose debugging.
CONFIG_APP_LORA_P2P=y

# History isn't under test; shrink the RAM ring (debug.conf already keeps
# history in RAM, CONFIG_APP_HISTORY_FLASH=n) to the smallest practical size.
CONFIG_APP_HISTORY_BYTES=64

# Watchdog isn't needed for an interactive bench session (no unattended
# operation to protect) and its callers are already CONFIG_WATCHDOG-guarded
# throughout (app_lrw.c, app_p2p.c, main.c), so disabling it is safe.
CONFIG_WATCHDOG=n

# Deferred-logging buffers: still enough for the P2P module's own LOG_INF
# lines (frame hex dumps top out around ~500 B, larger than any single log
# buffer here, but the ring drains continuously so this is about steady-state
# capacity, not one message's worst case) at roughly half debug.conf's sizing.
CONFIG_LOG_BUFFER_SIZE=384
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=512
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1280
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
