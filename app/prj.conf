# System heap backs only the 1-Wire bus scan (app_w1.c), which k_mallocs one
# ~16 B scan_item per ROM up to APP_W1_SCAN_MAX=32 (≈768 B incl. sys_heap block
# overhead). 1024 B holds the full 32-device cap with margin; the old 2048 was
# ~2x oversized (#221.2).
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_IDLE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_REBOOT=y
# Drop the "*** Booting Zephyr ***" banner (~0.3 KB flash, #220); the boot log
# line "Firmware version: ..." is our own LOG_INF and is unaffected.
CONFIG_BOOT_BANNER=n
CONFIG_I2C=y
# Bus recovery (H-6): app_sensor calls i2c_recover_bus() after a run of failed
# reads to bit-bang 9 clocks and free a wedged bus; without this it returns
# -ENOSYS and a stuck bus leaves every onboard sensor permanently dead. Needs
# scl-gpios/sda-gpios on the &i2c1 node (board DTS).
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_SENSOR=y
CONFIG_PM=y
CONFIG_PM_DEVICE=y
# Device runtime PM stays ON (low idle current: it on-demand-suspends idle
# peripherals — worth ~200 µA vs disabling it globally, measured on HW). The
# NFC-on-release failure it caused is handled in the NFC layer, not by turning PM
# off: servicing one encrypted tag command is many back-to-back i2c1 transfers
# and, on release, the CPU dropped into Stop2 in the field-off gaps between them,
# which corrupts the i2c1 (ST25DV) tag I/O (release-only; debug runs PM=n and
# never sleeps). app_nfc.c now holds a SUSPEND_TO_IDLE policy lock for the whole
# RF session (nfc_keep_awake, armed from the GPO ISR on RF field-on/write), so no
# Stop2 lands mid-operation; the lock is released after a short RF-quiet window so
# deep sleep resumes. The NFC poll is also event-driven (waits forever on the GPO
# when idle, no periodic Stop2 wake). Validated on hardware.
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_SPI=y

CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_CRC=y # history ring page-header integrity (app_history.c, #265)

# Link-Time Optimization: defer final codegen to link time so the compiler sees
# the whole program and eliminates dead code across translation-unit boundaries
# (LoRaMac Class B/C + FUOTA variants STICKER never calls).
# Reclaims ~19 KB flash (release ~99.9% → ~88.5%), restoring headroom for bug
# fixes that otherwise fail to link (#263). ISR_TABLES_LOCAL_DECLARATION is
# required for the vector table to build correctly under LTO. Note: setting
# CONFIG_LTO=y on the west command line silently does not apply — keep it here.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Image size budget — must equal the history_partition offset (sticker.dts):
# with CONFIG_APP_HISTORY_FLASH=y (release default) the history ring rewrites
# that area at runtime, and NVS settings + LoRaWAN NVM always rewrite the
# storage_partition. An image leaking into either region gets corrupted in
# flash → hard fault on next boot, recoverable only by mass erase. With this
# set, the linker fails the build instead ("region ROM overflowed").
# #265 grew this 0x28000 → 0x2C000 (code 160 KB → 176 KB) after the history
# partition shrank to 64 KB @ 0x2C000. debug.conf (history in RAM) relaxes
# this to the storage offset 0x3C000.
CONFIG_FLASH_LOAD_SIZE=0x2C000

CONFIG_LORA=y
CONFIG_LORAMAC_REGION_AU915=y
CONFIG_LORAMAC_REGION_EU868=y
CONFIG_LORAMAC_REGION_US915=y
CONFIG_LORAWAN_NVM_SETTINGS=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_SYSTEM_MAX_RX_ERROR=100

# Wall-clock: STM32 RTC (LSE-backed) set from LoRaWAN DeviceTimeReq. See app_clock.c.
CONFIG_RTC=y
CONFIG_RTC_STM32=y

CONFIG_LIS2DH_ACCEL_RANGE_4G=y
CONFIG_LIS2DH_BLOCK_DATA_UPDATE=y
CONFIG_LIS2DH_ODR_5=y
CONFIG_LIS2DH_OPER_MODE_LOW_POWER=y
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y

CONFIG_ENTROPY_GENERATOR=y

CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# Reset-cause readback reported in GetInfo so watchdog/brownout resets are
# visible in the field (#88).
CONFIG_HWINFO=y

CONFIG_ADC=y

CONFIG_LIS2DH=y
CONFIG_MPL3115A2=y
CONFIG_OPT3001=y
CONFIG_SHT4X=y
CONFIG_W1=y

CONFIG_NET_BUF=y
CONFIG_NANOPB=y

# mbedTLS is gone (#261): the NFC AES-CCM channel is now served by app_ccm (RFC
# 3610) over the STM32WL on-die AES peripheral, saving ~6.5 KB flash. LoRaMac uses
# its own soft-SE AES, independent of this.
