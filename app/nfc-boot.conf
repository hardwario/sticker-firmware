# Variant-B NFC firmware update overlay.
#
# Links the application at slot0 (0xC000) behind the NFC bootloader and
# enforces the slot0 size bound, instead of the default flat image from 0x0.
# Use together with the boot/ image:
#   west build -b sticker sticker/app -- -DEXTRA_CONF_FILE=nfc-boot.conf
#
# See doc/nfc-update-protocol.md §7 and boot/README.md.

CONFIG_USE_DT_CODE_PARTITION=y
