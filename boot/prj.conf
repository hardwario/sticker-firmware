# STICKER NFC bootloader — minimal Zephyr configuration.
# WIP: tune for the ~48 KB boot_partition once signature verify is wired.

# No bootloader chaining; this IS the first-stage image.
CONFIG_BOOTLOADER_MCUBOOT=n

# Peripherals.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=n

# CRC (crc32_ieee).
CONFIG_CRC=y

# Size / footprint.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=2048

# Minimal console for bring-up (drop in release).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# No logging subsystem in the bootloader (keep it small).
CONFIG_LOG=n

# Debug-only: accept unsigned images (production must verify the signature).
# CONFIG_BOOT_ALLOW_UNSIGNED=y
