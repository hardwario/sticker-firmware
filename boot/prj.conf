# STICKER NFC bootloader — minimal Zephyr configuration.
# WIP: tune for the ~48 KB boot_partition once signature verify is wired.

# No bootloader chaining; this IS the first-stage image.
CONFIG_BOOTLOADER_MCUBOOT=n

# Link at boot_partition (0x0) and enforce its 48K bound (app.overlay chooses it).
CONFIG_USE_DT_CODE_PARTITION=y

# Peripherals.
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=n

# CRC (crc32_ieee).
CONFIG_CRC=y

# sys_reboot().
CONFIG_REBOOT=y

# AES-CCM frame authentication (PSA/mbedTLS, same path as app config-ingest).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_ENTROPY_GENERATOR=y

# Size / footprint.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MULTITHREADING=y
CONFIG_MAIN_STACK_SIZE=2048

# Minimal console for bring-up (drop in release).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# No logging subsystem in the bootloader (keep it small).
CONFIG_LOG=n
