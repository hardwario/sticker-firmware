name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: sticker
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: sticker
          toolchains: arm-zephyr-eabi

      - name: Determine version
        id: version
        working-directory: sticker
        shell: bash
        run: |
          # build_type (source): 0=MAIN (tag), 1=DEV (branch/PR). Local builds
          # default to 2=CUSTOM in CMake. The debug/release config is a separate
          # axis (CONFIG_FW_DEBUG), driven by the matrix, not this value.
          #
          # VERSION names the artifact (tag for releases, short hash otherwise).
          # SEMVER is what gets baked into the firmware: the tag for releases,
          # else the latest tag (so branch builds report the release they build
          # on top of, matching the local git-describe behaviour in CMake).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="v${GITHUB_REF#refs/tags/v}"
            BUILD_TYPE=0
            SEMVER="$VERSION"
          else
            VERSION="$(git rev-parse --short HEAD)"
            BUILD_TYPE=1
            SEMVER="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          MAJOR=0; MINOR=0; PATCH=0
          if [[ "$SEMVER" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        working-directory: sticker/app
        shell: bash
        run: |
          if [ "${{ matrix.config }}" == "debug" ]; then
             ARGS="-DEXTRA_CONF_FILE=debug.conf"
          else
             ARGS=""
          fi

          west build -p always -b sticker -- $ARGS \
            -DAPP_VERSION_MAJOR=${{ steps.version.outputs.major }} \
            -DAPP_VERSION_MINOR=${{ steps.version.outputs.minor }} \
            -DAPP_VERSION_PATCH=${{ steps.version.outputs.patch }} \
            -DAPP_BUILD_TYPE=${{ steps.version.outputs.build_type }}

          mkdir -p ../artifacts

          cp build/zephyr/zephyr.hex \
            ../artifacts/hio-sticker-${{ steps.version.outputs.value }}-${{ matrix.config }}.hex

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: hio-sticker-${{ steps.version.outputs.value }}-${{ matrix.config }}
          path: sticker/artifacts/hio-sticker-${{ steps.version.outputs.value }}-${{ matrix.config }}.hex
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS decoder tests
        working-directory: app/decoder
        run: node --test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install configen test deps
        run: pip install -r scripts/west_commands/requirements-dev.txt

      - name: configen + proto tests
        run: pytest scripts/west_commands/tests

      - name: clang-format check (app/src)
        run: |
          git ls-files 'app/src/*.c' 'app/src/*.h' \
            | xargs clang-format --dry-run --Werror

  unit-tests:
    name: Unit tests (native_sim)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: sticker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: sticker
          toolchains: arm-zephyr-eabi

      - name: Run native_sim ztest suites
        working-directory: sticker
        run: bash tests/run_native.sh

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Determine version
        id: version
        run: |
          VERSION="v${GITHUB_REF#refs/tags/v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: hio-sticker-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: STICKER Firmware ${{ steps.version.outputs.value }}
          files: |
            artifacts/*.hex
