name: Build

# #485 B10: a push to a feature branch with an open PR ran the whole workflow
# twice (push + pull_request, different concurrency groups). Feature branches
# are built through their PR; pushes build the long-lived branches and tags.
on:
  push:
    branches: [main, 'v[0-9]*']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# Least privilege: only the release job writes (it creates the GitHub release).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [debug, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: sticker
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: sticker
          toolchains: arm-zephyr-eabi

      - name: Apply module patches
        working-directory: sticker
        run: west patch apply

      - name: Determine version
        id: version
        working-directory: sticker
        shell: bash
        run: |
          # build_type (source): 0=MAIN (tag), 1=DEV (branch/PR). Local builds
          # default to 2=CUSTOM in CMake. The debug/release config is a separate
          # axis (CONFIG_FW_DEBUG), driven by the matrix, not this value.
          #
          # VERSION names the artifact (tag for releases, short hash otherwise).
          # A tag build bakes the tag's numbers into the firmware. A branch/PR
          # build passes no numbers and keeps the version in app/CMakeLists.txt,
          # so it reports the release it builds towards (v2.0.0 branch -> 2.0.0,
          # DEV), not the latest tag: Portal gates features on the fw version.
          VERSION_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="v${GITHUB_REF#refs/tags/v}"
            BUILD_TYPE=0
            if [[ "$VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              VERSION_ARGS="-DAPP_VERSION_MAJOR=${BASH_REMATCH[1]}"
              VERSION_ARGS+=" -DAPP_VERSION_MINOR=${BASH_REMATCH[2]}"
              VERSION_ARGS+=" -DAPP_VERSION_PATCH=${BASH_REMATCH[3]}"
            fi
          else
            VERSION="$(git rev-parse --short HEAD)"
            BUILD_TYPE=1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_args=$VERSION_ARGS" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        working-directory: sticker/app
        shell: bash
        run: |
          if [ "${{ matrix.config }}" == "debug" ]; then
             ARGS="-DEXTRA_CONF_FILE=debug.conf"
          else
             ARGS=""
          fi

          set -o pipefail
          west build -p always -b sticker -- $ARGS \
            ${{ steps.version.outputs.version_args }} \
            -DAPP_BUILD_TYPE=${{ steps.version.outputs.build_type }} \
            | tee build-${{ matrix.config }}.log

          mkdir -p ../artifacts

          cp build/zephyr/zephyr.hex \
            ../artifacts/hio-sticker-${{ steps.version.outputs.value }}-${{ matrix.config }}.hex

      # #485 B3: the linker only fails at 0 B free, but the release image needs
      # headroom: RAM for the heap / stacks that the linker does not see (a
      # debug build crashed on HW at a ~20-170 B margin, debug.conf), flash for
      # the next fix. Fail the release build below these floors; every build
      # puts its memory report in the job summary.
      - name: Check flash/RAM headroom
        working-directory: sticker/app
        shell: bash
        env:
          MIN_FREE_FLASH: ${{ matrix.config == 'release' && 8192 || 0 }}
          MIN_FREE_RAM: ${{ matrix.config == 'release' && 8192 || 0 }}
        run: |
          rc=0
          awk -v min_flash="$MIN_FREE_FLASH" -v min_ram="$MIN_FREE_RAM" '
            function bytes(n, u) {
              return u == "KB" ? n * 1024 : u == "MB" ? n * 1048576 : u == "GB" ? n * 1073741824 : n
            }
            $1 == "FLASH:" || $1 == "RAM:" {
              name = substr($1, 1, length($1) - 1)
              free = bytes($4, $5) - bytes($2, $3)
              printf "| %s | %d B | %d B | %d B | %s |\n", name, bytes($2, $3), bytes($4, $5), free, $6
              min = name == "FLASH" ? min_flash : min_ram
              seen[name] = 1
              if (free < min) {
                printf "::error::%s free %d B is below the %d B floor\n", name, free, min > "/dev/stderr"
                bad = 1
              }
            }
            END {
              if (!seen["FLASH"] || !seen["RAM"]) {
                print "::error::linker memory report not found" > "/dev/stderr"
                exit 1
              }
              exit bad
            }
          ' build-${{ matrix.config }}.log > size.md || rc=$?
          {
            echo "### Memory (${{ matrix.config }})"
            echo "| Region | Used | Size | Free | Used % |"
            echo "|---|---|---|---|---|"
            cat size.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat size.md
          exit $rc

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: hio-sticker-${{ steps.version.outputs.value }}-${{ matrix.config }}
          path: sticker/artifacts/hio-sticker-${{ steps.version.outputs.value }}-${{ matrix.config }}.hex
          if-no-files-found: error

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS decoder tests
        working-directory: app/decoder
        run: node --test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install configen test deps
        run: pip install -r scripts/west_commands/requirements-dev.txt

      - name: configen + proto tests
        run: pytest scripts/west_commands/tests

      - name: clang-format check (app/src)
        run: |
          # The pinned pip clang-format must win over the runner's apt one
          # (#485 B10): a different version formats differently.
          clang-format --version | grep -F 'version 22.1.5'
          git ls-files 'app/src/*.c' 'app/src/*.h' \
            | xargs clang-format --dry-run --Werror

  unit-tests:
    name: Unit tests (native_sim)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: sticker
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: sticker
          toolchains: arm-zephyr-eabi

      - name: Run native_sim ztest suites
        working-directory: sticker
        run: bash tests/run_native.sh

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine version
        id: version
        run: |
          VERSION="v${GITHUB_REF#refs/tags/v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: hio-sticker-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: STICKER Firmware ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            artifacts/*.hex
