name: nfc_flasher
description: STICKER NFC firmware flasher — streams a signed firmware image to a device over NFC.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  # Android NfcV (ISO15693) transceive to the ST25DV tag.
  nfc_manager: ^3.5.0
  # Download firmware from a direct URL or a GitHub release.
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
