description: |
  STICKER simulator ADC. Reports a fixed voltage per channel, set by the
  simulator (`sim battery`, `sim analog`). Internal reference 3300 mV.

compatible: "hardwario,sim-adc"

include: adc-controller.yaml

properties:
  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
