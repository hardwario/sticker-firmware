CONFIG_ZTEST=y

# app_ccm uses a k_mutex; the default kernel on native_sim provides it.

# PSA AES-CCM is used ONLY as an independent RFC 3610 oracle to cross-check
# app_ccm's output — it is not what the firmware ships (that is app_ccm over the
# HW AES / soft-SE, no mbedTLS). Mirrors tests/nfc_crypto.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_TEST_RANDOM_GENERATOR=y
