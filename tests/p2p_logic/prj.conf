CONFIG_ZTEST=y

# app_radio_p2p.c is compiled directly (see CMakeLists); it needs a settings backend
# to link, and a RNG for its retry jitter. A RAM stub store (src/stubs.c) accepts
# every save, or fails them with test_settings_save_ret: the dev_nonce write is
# fail-closed, so a backend whose saves always fail would stop every join.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_CUSTOM=y
CONFIG_TEST_RANDOM_GENERATOR=y

# app_radio_p2p.c's CONFIG_SHELL / CONFIG_WATCHDOG paths are left out to shrink the
# link surface (same technique as tests/alarm_eval): the debug shell helpers
# and the watchdog heartbeat are not part of the pure logic under test.
