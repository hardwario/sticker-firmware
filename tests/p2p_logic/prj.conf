CONFIG_ZTEST=y

# app_p2p.c is compiled directly (see CMakeLists); it needs a settings backend
# to link, and a RNG for its retry jitter. CONFIG_SETTINGS_NONE means saves are
# no-ops -- fine, the pure-logic tests never rely on persistence.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_TEST_RANDOM_GENERATOR=y

# app_p2p.c's CONFIG_SHELL / CONFIG_WATCHDOG paths are left out to shrink the
# link surface (same technique as tests/alarm_eval): the debug shell helpers
# and the watchdog heartbeat are not part of the pure logic under test.
