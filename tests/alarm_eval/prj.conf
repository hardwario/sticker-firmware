CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# app_alarm.c's buzzer indication is CONFIG_APP_BUZZER-gated (issue #395);
# this suite exercises that path against stubs.c, not a real driver.
CONFIG_APP_BUZZER=y

# The sensor-mismatch watchdog (#430) and the 1-Wire no-data gate are
# CONFIG_W1-gated; the slot accessors are stubbed in stubs.c.
CONFIG_W1=y
