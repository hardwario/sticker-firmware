# Minimal gw-sim bench firmware (#118, doc/p2p.md §14). Raw LoRa only -- no
# CONFIG_LORAWAN (that pulls in the whole LoRaMac stack/region tables this
# firmware never touches; app_p2p.c itself only needs CONFIG_LORA too).
CONFIG_LORA=y

# Shell over RTT -- the only UI this firmware has ("fully controllable via
# rttt"). Console/RTT/log wiring mirrors the main app's debug.conf.
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT_BUFFER=0
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_PROMPT_RTT="p2p-sim:~$ "

# Room for a full 255 B hex frame typed into `p2p tx` (11 B header + 240 B body
# + 4 B tag, each byte 2 hex chars -> ~510 B worst case; comfortably covers any
# realistic bench test frame without needing the main app's shell tuning).
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=600
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SEGGER_RTT_SECTION_CUSTOM=y

# rx_work_handler runs on the SYSTEM work queue (k_work_submit(), no dedicated
# queue in this minimal firmware) and calls into app_ccm_auth_decrypt() plus
# synchronous LOG_INF formatting (CONFIG_LOG_MODE_MINIMAL) -- measured to
# overflow the Zephyr default 1024 B stack on real HW (MPU fault, "Stack
# overflow on CPU 0" while decrypting a real RX frame). Large scratch buffers
# were also moved off the stack (static) in main.c; this is the remaining
# headroom for the crypto call depth.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# `p2p tx`'s cmd_p2p_tx() runs directly on the shell's own thread and calls
# into app_ccm_encrypt_and_tag() + lora_send() on top of the shell's own
# command-dispatch stack usage -- measured to overflow the Zephyr default
# 2048 B shell stack on real HW (same "Stack overflow on CPU 0" class as the
# rx_work_handler fix above, this time thread `shell_rtt`). Large scratch
# buffers were also moved off the stack (static) in cmd_p2p_tx().
CONFIG_SHELL_STACK_SIZE=3072
