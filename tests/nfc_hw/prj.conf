CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_NANOPB=y

# Exercise the production default (encrypted NFC command channel) rather than
# the CONFIG_FW_DEBUG plaintext escape hatch.
CONFIG_APP_NFC_ENCRYPTION=y

# ST25DV i2c_emul model + GPO/LPD gpio_emul (native_sim's built-in gpio0).
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_EMUL=y

# Settings backend for the clm/state subtree (app_nfc_init/nfc_check_locked) —
# no-op storage is enough for the first slice of tests (RAM-only assertions);
# upgrade to a flash-simulator-backed NVS partition (see tests/history_flash)
# once a test needs persistence to survive an app_nfc_init() "reboot".
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y

# Same PSA/mbedTLS AES-CCM backend app_ccm.c falls back to off-target (app/prj.conf,
# tests/nfc_crypto/prj.conf) — APP_NFC_ENCRYPTION defaults on, APP_NFC_ENCRYPTION_HW
# needs SOC_SERIES_STM32WLX so it never selects here.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_TEST_RANDOM_GENERATOR=y
